<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Магазин{% endblock %}</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light d-flex flex-column min-vh-100">

  <nav class="navbar navbar-expand-lg navbar-dark bg-primary mb-4">
    <div class="container">
      <a class="navbar-brand" href="{% url 'shopapp:index' %}">🛒 Магазин</a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#mainNav">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="mainNav">
        <div class="navbar-nav me-auto">
          <a class="nav-link" href="{% url 'shopapp:products_list' %}">Продукты</a>
          <a class="nav-link" href="{% url 'shopapp:orders_list' %}">Заказы</a>
        </div>
        <div class="navbar-nav">
          {% if user.is_authenticated %}
            <a class="nav-link" href="{% url 'myauth:about-me' %}">{{ user.username }}</a>
            <a class="nav-link" href="{% url 'myauth:logout' %}">Выйти</a>
          {% else %}
            <a class="nav-link" href="{% url 'myauth:login' %}">Войти</a>
            <a class="nav-link" href="{% url 'myauth:register' %}">Регистрация</a>
          {% endif %}
        </div>
      </div>
    </div>
  </nav>

  <main class="container flex-grow-1">
    {% block body %}{% endblock %}
  </main>

  <footer class="bg-dark text-white text-center py-3 mt-4">
    <div class="container">
      <small>Учебный проект магазина на Django · {% now "Y" %}</small>
    </div>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
