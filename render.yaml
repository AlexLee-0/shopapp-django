services:
  - type: web
    name: shopapp-django
    runtime: docker
    plan: free
    envVars:
      - key: DJANGO_DEBUG
        value: "1"
      - key: SECRET_KEY
        generateValue: true
      - key: ALLOWED_HOSTS
        value: "*"
    dockerCommand: sh -c "python manage.py migrate && gunicorn mysite.wsgi:application --bind 0.0.0.0:8000 --workers 3"