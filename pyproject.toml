[tool.poetry]
package-mode = false


[project]
name = "shopapp-django"
version = "0.1.0"
description = "Django Shop Project"
authors = [
    {name = "Alexey Lee",email = "a.lee2212@gmail.com"}
]
requires-python = ">=3.11"
dependencies = [
    "django (>=4.2,<5.0)",
    "djangorestframework (>=3.14,<4.0)",
    "django-filter (>=23.5,<24.0)",
    "pillow (>=10.0,<11.0)",
    "python-dotenv (>=1.0,<2.0)",
    "gunicorn (>=21.2,<22.0)"
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
